<!DOCTYPE html>
<html>
<head>
    <title>Dollar to Rupee Converter</title>
</head>
<body>

    <h2>Dollar to Rupee Converter</h2>

    <input type="number" id="amount" placeholder="Enter USD amount" value="1">
    <button onclick="convert()">Convert</button>

    <div id="result"></div>

    <script>
        const apiKey = "X5y7oehH9DTttdZBVNf4OlnLhiaDNVwjSOcQXqNt";

        async function convert() {
            let amount = document.getElementById("amount").value;
            let result = document.getElementById("result");

            if (amount === "" || Number(amount) <= 0) {
                result.innerText = "Enter a valid amount";
                return;
            }

            result.innerText = "Loading...";

            try {
                let url = `https://api.api-ninjas.com/v1/convertcurrency?have=USD&want=INR&amount=${encodeURIComponent(amount)}`;

                let res = await fetch(url, {
                    headers: {
                        "X-Api-Key": apiKey
                    }
                });

                let data = await res.json();

                if (!res.ok) {
                    result.innerText = "Error: " + (data.error || data.message || res.status);
                    return;
                }

                result.innerHTML =
                    `<h3>$${data.old_amount} = ₹${Number(data.new_amount).toFixed(2)}</h3>
                     <p>Exchange Rate: 1 USD = ₹${(data.new_amount / data.old_amount).toFixed(4)}</p>
                     <p>Currency: ${data.old_currency} to ${data.new_currency}</p>`;
            } catch (e) {
                result.innerText = "Failed to fetch data. Check your connection.";
            }
        }
    </script>

</body>
</html>
